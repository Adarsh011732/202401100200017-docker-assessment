services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U festpass -d festpass" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: adarshsingh000/fest-backend:1.0.0
    environment:
      REGNO: "202401100200017"
      APP_VERSION: "1.0.0"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - frontend-backend
      - backend-db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8017:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-backend
    depends_on:
      - backend

networks:
  frontend-backend:
  backend-db:

volumes:
  pgdata:
